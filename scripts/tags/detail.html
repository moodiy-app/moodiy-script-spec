<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tags</title>
<style>
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; }
  h2 { font-size: 16px; margin: 16px 0 6px; }
  p, ul { margin: 6px 0; }
  code { font-family: ui-monospace, Menlo, monospace; background: rgba(127, 127, 127, .18); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<h2>What it does</h2>
<p>Lists the tags of the entry. The output is the tags written as hashtags, for example <code>#work #good-mood</code>, so that the next step can use them.</p>
<p>An entry without tags is <i>skipped</i>.</p>

<h2>Argument</h2>
<p><code>limit</code> (a whole number): keep only the first tags. <code>0</code>, or no value, keeps all of them.</p>
</body>
</html>
